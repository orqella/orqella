server {
    listen 8080;
    server_name ~^m-[^.]+\.modules\.;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /module-bootstrap.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://orqella-web.fly.dev https://orqella-web-staging.fly.dev http://127.0.0.1:* http://localhost:* http://*.localhost:* http://orqella.localhost:*";
        try_files $uri =404;
    }

    location = /module-bootstrap.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /module-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /module-bridge.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /favicon.ico {
        return 204;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Fly terminates TLS before nginx reaches port 8080. Keep redirects
    # relative so the browser stays on https://<host>/ instead of being sent
    # to http://<host>:8080/.
    absolute_redirect off;
    port_in_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        return 302 /client/;
    }

    location = /client/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self' https: http:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /client/index.html;
    }

    location = /client/index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self' https: http:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location = /app-client/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self' http://*.orqella.localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'; frame-ancestors 'self' http://*.orqella.localhost:* http://127.0.0.1:*" always;
        try_files $uri $uri/ /app-client/index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /app-sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /module-bootstrap.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://orqella-web.fly.dev https://orqella-web-staging.fly.dev http://127.0.0.1:* http://localhost:* http://*.localhost:* http://orqella.localhost:*";
    }

    location = /module-bootstrap.js {
        add_header Cache-Control "no-cache";
    }

    location = /module-sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /module-bridge.js {
        add_header Cache-Control "no-cache";
    }

    location /pkg/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }

    location / {
        # Module origins only serve the generic bootstrap. Never expose the
        # transport client, its service worker, WASM, or app files there.
        if ($host ~* "^m-[^.]+\.modules\.") {
            return 404;
        }
        try_files $uri $uri/ =404;
    }
}
