server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = / {
        return 302 /client/;
    }

    location = /client/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /client/index.html;
    }

    location = /client/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /app-sw.js {
        add_header Cache-Control "no-cache";
    }

    location /pkg/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
