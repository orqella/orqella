[workspace]
members = [
  "crates/orqella-desktop-gateway",
  "crates/orqella-desktop-transport",
  "desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
http = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
url = "2"

[profile.release]
lto = "thin"
strip = true
