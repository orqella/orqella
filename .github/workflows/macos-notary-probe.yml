name: macOS notary probe

# Diagnostic only: signs a trivial binary and polls the notary submission so we
# can distinguish a stuck Apple queue from a problem with the desktop bundle.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-notary-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Submit a tiny signed binary
    runs-on: macos-15
    timeout-minutes: 20
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - name: Import the signing certificate
        shell: bash
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/probe.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="${RUNNER_TEMP}/developer-id.p12"
          printf '%s' "${APPLE_CERTIFICATE}" | openssl base64 -d -A > "${cert}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 1800 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${cert}" -k "${keychain}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain}"
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security default-keychain -s "${keychain}"
          security find-identity -v -p codesigning "${keychain}"
          p8="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${p8}"
          chmod 600 "${p8}"
          echo "APPLE_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"
          echo "APPLE_API_KEY_PATH=${p8}" >> "${GITHUB_ENV}"
      - name: Sign a trivial binary
        shell: bash
        run: |
          set -euo pipefail
          printf 'int main(void){return 0;}\n' > "${RUNNER_TEMP}/probe.c"
          clang -o "${RUNNER_TEMP}/probe" "${RUNNER_TEMP}/probe.c"
          codesign --force --options runtime --timestamp \
            --keychain "${APPLE_KEYCHAIN}" \
            --sign "${APPLE_SIGNING_IDENTITY}" "${RUNNER_TEMP}/probe"
          codesign --verify --strict --verbose=2 "${RUNNER_TEMP}/probe"
          codesign -dvvv "${RUNNER_TEMP}/probe" 2>&1 | grep '^Timestamp='
          ditto -c -k --keepParent "${RUNNER_TEMP}/probe" "${RUNNER_TEMP}/probe.zip"
      - name: Submit and poll
        shell: bash
        run: |
          set -euo pipefail
          submit="$(xcrun notarytool submit "${RUNNER_TEMP}/probe.zip" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" \
            --output-format json)"
          echo "${submit}"
          id="$(printf '%s' "${submit}" | jq -r '.id')"
          echo "submission id: ${id}"
          for attempt in $(seq 1 20); do
            info="$(xcrun notarytool info "${id}" \
              --key "${APPLE_API_KEY_PATH}" \
              --key-id "${APPLE_API_KEY}" \
              --issuer "${APPLE_API_ISSUER}" \
              --output-format json)"
            status="$(printf '%s' "${info}" | jq -r '.status')"
            echo "attempt ${attempt}: ${status}"
            case "${status}" in
              Accepted|Invalid|Rejected) printf '%s\n' "${info}"; break ;;
            esac
            sleep 15
          done
      - name: Show notary history
        if: always()
        shell: bash
        run: |
          xcrun notarytool history \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" || true
