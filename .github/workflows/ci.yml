name: CI

# Automatic CI is paused to conserve GitHub Actions minutes. Run it from the
# Actions tab or with `gh workflow run CI` when a manual check is wanted.
# Restore automatic runs by replacing the trigger below with:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: License and dependency policy
        run: |
          cargo install cargo-deny --locked
          cargo deny check --hide-inclusion-graph
      - name: Check forbidden transport configuration
        run: |
          set -euo pipefail
          if grep -RInE 'account_url|relay_broker|IROH_SERVICES_API_SECRET|--relay-url|LinkRelay::' \
            src crates client web \
            --exclude=config.rs \
            --exclude-dir=target \
            --exclude-dir=.git \
            --exclude-dir=vendor; then
            echo "forbidden public Link/relay configuration found" >&2
            exit 1
          fi
          if grep -RInE 'public N0|Iroh Pro|self-hosted Link|bring-your-own relay' \
            README.md docs client/docs web-client \
            --exclude-dir=target; then
            echo "forbidden self-hosting documentation found" >&2
            exit 1
          fi
      - name: Dashboard and browser tests
        run: |
          node --check web/app.js
          node --test web/tests/*.test.mjs web-client/tests/*.test.mjs

  desktop:
    name: Desktop client (Linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential file libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: client -> target
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Dependency policy
        run: |
          cargo install cargo-deny --locked
          cargo deny --config ../deny.toml check --hide-inclusion-graph
      - name: Build desktop binary
        run: cargo build -p orqella-desktop

  core-cross-platform:
    name: Core check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Check workspace
        run: cargo check --workspace --all-targets
