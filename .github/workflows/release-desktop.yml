name: Release Orqella Desktop

# Desktop releases use their own tag namespace so the website can show the
# daemon and desktop versions independently.
#
# Required for macOS releases:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
#   APPLE_API_KEY, APPLE_API_KEY_P8, APPLE_API_ISSUER, APPLE_TEAM_ID
# Required for signed Tauri updater artifacts:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Windows signing is not wired up yet; see docs/DESKTOP_SIGNING.md.
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing desktop tag to publish, for example desktop-v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Validate desktop tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - id: version
        name: Read and validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' client/Cargo.toml | head -1)"
          expected="desktop-v${version}"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "tag ${RELEASE_TAG} does not match client/Cargo.toml ${expected}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  prepare-release:
    name: Create desktop draft release
    permissions:
      contents: write
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Create the draft release once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists"
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "Orqella Desktop v${VERSION}" \
            --notes "Orqella Desktop bundles for Linux, macOS, and Windows.

macOS builds are signed with a Developer ID certificate and notarized by
Apple. Windows builds are not signed yet. Verify downloads with
\`SHA256SUMS.txt\`."

  build:
    name: Build ${{ matrix.platform }}
    permissions:
      contents: write
    needs: [prepare, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            args: ""
          - platform: macos-arm64
            os: macos-15
            args: "--target aarch64-apple-darwin"
          - platform: macos-x86_64
            os: macos-15
            args: "--target x86_64-apple-darwin"
          - platform: windows-x86_64
            os: windows-2022
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential file libssl-dev libfuse2 rpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: client -> target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.6
      - name: Configure macOS signing
        if: matrix.os == 'macos-15'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_KEY_P8 \
            APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::macOS releases must be signed; missing secrets: ${missing[*]}"
            exit 1
          fi
          p8="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${p8}"
          chmod 600 "${p8}"
          certificate="$(printf '%s' "${APPLE_CERTIFICATE}" | tr -d '\r\n')"
          # Tauri reads these from the job environment while bundling. The
          # certificate is imported into a temporary keychain by the Tauri CLI.
          {
            printf 'APPLE_CERTIFICATE=%s\n' "${certificate}"
            printf 'APPLE_CERTIFICATE_PASSWORD=%s\n' "${APPLE_CERTIFICATE_PASSWORD}"
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "${APPLE_SIGNING_IDENTITY}"
            printf 'APPLE_API_KEY=%s\n' "${APPLE_API_KEY}"
            printf 'APPLE_API_KEY_PATH=%s\n' "${p8}"
            printf 'APPLE_API_ISSUER=%s\n' "${APPLE_API_ISSUER}"
            printf 'APPLE_TEAM_ID=%s\n' "${APPLE_TEAM_ID}"
          } >> "${GITHUB_ENV}"
      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is required for a GA desktop release" >&2
            exit 1
          }
      - id: tauri
        name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORQELLA_DESKTOP_UPDATER: "1"
          # Required for the Tauri updater manifest and signatures. Configure
          # these repository secrets before the first GA desktop release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "Orqella Desktop v__VERSION__"
          releaseBody: |
            Orqella Desktop bundles for Linux, macOS, and Windows.

            macOS builds are signed with a Developer ID certificate and
            notarized by Apple. Windows builds are not signed yet.
            Verify downloads with `SHA256SUMS.txt`.
          releaseDraft: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-rc') || contains(needs.prepare.outputs.tag, '-beta') || contains(needs.prepare.outputs.tag, '-alpha') }}
          projectPath: client/desktop/src-tauri
          tauriScript: tauri
          args: ${{ matrix.args }}
          generateReleaseNotes: true
          # The checksums job merges one complete updater manifest after every
          # platform has uploaded its assets. Per-platform manifests would
          # overwrite each other and publish a partial platform set.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
      - name: Notarize and staple the macOS DMG
        if: matrix.os == 'macos-15'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg="$(find client/target -type f -name '*.dmg' -path '*/bundle/dmg/*' | head -1)"
          test -n "${dmg}" || { echo "::error::no DMG was produced"; exit 1; }
          # Tauri notarizes and staples the .app but only signs the DMG. Submit
          # the DMG as well so the download itself carries a ticket.
          xcrun notarytool submit "${dmg}" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${dmg}"
          xcrun stapler validate "${dmg}"
          gh release upload "${RELEASE_TAG}" "${dmg}" --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Verify the macOS signature and ticket
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find client/target -type d -name 'Orqella Desktop.app' -path '*/bundle/macos/*' | head -1)"
          test -n "${app}" || { echo "::error::no app bundle was produced"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${app}"
          spctl --assess --type execute --verbose=4 "${app}"
          xcrun stapler validate "${app}"

  checksums:
    name: Publish desktop checksums
    permissions:
      contents: write
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir assets
      - name: Merge the updater manifest
        working-directory: assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          mapping = {
              "darwin-aarch64": "Orqella.Desktop_{version}_aarch64.app.tar.gz",
              "darwin-aarch64-app": "Orqella.Desktop_{version}_aarch64.app.tar.gz",
              "darwin-x86_64": "Orqella.Desktop_{version}_x64.app.tar.gz",
              "darwin-x86_64-app": "Orqella.Desktop_{version}_x64.app.tar.gz",
              "linux-x86_64": "Orqella.Desktop_{version}_amd64.AppImage",
              "linux-x86_64-appimage": "Orqella.Desktop_{version}_amd64.AppImage",
              "linux-x86_64-deb": "Orqella.Desktop_{version}_amd64.deb",
              "linux-x86_64-rpm": "Orqella.Desktop-{version}-1.x86_64.rpm",
              "windows-x86_64": "Orqella.Desktop_{version}_x64_en-US.msi",
              "windows-x86_64-msi": "Orqella.Desktop_{version}_x64_en-US.msi",
              "windows-x86_64-nsis": "Orqella.Desktop_{version}_x64-setup.exe",
          }
          version = os.environ["VERSION"]
          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          platforms = {}
          for platform, template in mapping.items():
              asset = template.format(version=version)
              signature = Path(f"{asset}.sig").read_text().strip()
              platforms[platform] = {
                  "signature": signature,
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{asset}",
              }
          manifest = {
              "version": version,
              "notes": (
                  "Orqella Desktop bundles for Linux, macOS, and Windows.\n\n"
                  "macOS builds are signed with a Developer ID certificate and\n"
                  "notarized by Apple. Windows builds are not signed yet.\n"
                  "Verify downloads with `SHA256SUMS.txt`."
              ),
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": dict(sorted(platforms.items())),
          }
          Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Write SHA256SUMS.txt
        working-directory: assets
        run: |
          set -euo pipefail
          sha256sum * > ../SHA256SUMS.txt
      - name: Upload checksums and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" SHA256SUMS.txt assets/latest.json --repo "${GITHUB_REPOSITORY}" --clobber

  publish:
    name: Publish desktop release
    permissions:
      contents: write
    needs: [prepare, build, checksums]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
