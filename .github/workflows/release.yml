name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify signed update manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify release
        env:
          ORQELLA_UPDATE_PUBLIC_KEY: ${{ secrets.ORQELLA_UPDATE_PUBLIC_KEY }}
        run: |
          if [ -z "$ORQELLA_UPDATE_PUBLIC_KEY" ]; then
            echo "ORQELLA_UPDATE_PUBLIC_KEY is required for a signed release" >&2
            exit 1
          fi
          scripts/release-verify.sh

  build:
    name: Build ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: orqella-linux-x86_64
            archive: tar.gz
          - os: macos-14
            artifact: orqella-macos-x86_64
            archive: tar.gz
          - os: windows-2022
            artifact: orqella-windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Build
        run: cargo build --release --locked
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: target/orqella.cdx.json
      - name: Package (Unix)
        if: matrix.os != 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/${{ matrix.artifact }}
          cp target/release/orqella dist/${{ matrix.artifact }}/
          cp README.md LICENSE NOTICE CHANGELOG.md install-linux.sh install-macos.sh dist/${{ matrix.artifact }}/
          cp -R skills dist/${{ matrix.artifact }}/
          cp target/orqella.cdx.json dist/${{ matrix.artifact }}/
          tar -C dist/${{ matrix.artifact }} -czf ${{ matrix.artifact }}.tar.gz .
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
      - name: Package (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.artifact }}" | Out-Null
          Copy-Item target/release/orqella.exe "dist/${{ matrix.artifact }}/"
          Copy-Item README.md,LICENSE,NOTICE,CHANGELOG.md,install-windows.ps1 "dist/${{ matrix.artifact }}/"
          Copy-Item -Recurse skills "dist/${{ matrix.artifact }}/skills"
          Copy-Item target/orqella.cdx.json "dist/${{ matrix.artifact }}/"
          Compress-Archive -Path "dist/${{ matrix.artifact }}/*" -DestinationPath "${{ matrix.artifact }}.zip"
          (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.artifact }}.zip" | Set-Content "${{ matrix.artifact }}.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.${{ matrix.archive }}
            ${{ matrix.artifact }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Attach release artifacts
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Include signed update manifest
        run: cp ORQELLA_UPDATE.json ORQELLA_UPDATE.json.minisig artifacts/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
