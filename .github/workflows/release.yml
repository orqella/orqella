name: Release Orqella

# Public releases are cut from tags. A tag release builds the daemon/CLI for
# Linux, macOS (Intel and Apple Silicon), and Windows, publishes SHA-256
# checksums, and attaches the signed update manifest when one is present.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.4.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-orqella-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - id: version
        name: Read and validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "orqella") | .version')"
          expected="v${version}"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "tag ${RELEASE_TAG} does not match Cargo.toml ${expected}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify signed update manifest
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify manifest when present
        env:
          ORQELLA_UPDATE_PUBLIC_KEY: ${{ secrets.ORQELLA_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ORQELLA_UPDATE.json ]; then
            echo "No ORQELLA_UPDATE.json in this tag; publishing binary assets only."
            exit 0
          fi
          if [ -z "${ORQELLA_UPDATE_PUBLIC_KEY}" ]; then
            echo "ORQELLA_UPDATE_PUBLIC_KEY is required to publish a signed update manifest" >&2
            exit 1
          fi
          scripts/release-verify.sh

  build:
    name: Build ${{ matrix.platform }}
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            archive: tar.gz
          - os: macos-15
            target: x86_64-apple-darwin
            platform: macos-x86_64
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            archive: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: target/orqella-${{ matrix.platform }}.cdx.json
      - name: Package (Unix)
        if: matrix.os != 'windows-2022'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          asset="orqella-${VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/orqella" "dist/${asset}/"
          cp README.md LICENSE NOTICE CHANGELOG.md "dist/${asset}/"
          cp -R skills "dist/${asset}/"
          cp "target/orqella-${{ matrix.platform }}.cdx.json" "dist/${asset}/"
          tar -C "dist/${asset}" -czf "dist/${asset}.tar.gz" .
          rm -rf "dist/${asset}"
          (cd dist && (sha256sum "${asset}.tar.gz" 2>/dev/null || shasum -a 256 "${asset}.tar.gz") > "${asset}.tar.gz.sha256")
      - name: Package (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $asset = "orqella-$env:VERSION-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "dist/$asset" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/orqella.exe" "dist/$asset/"
          Copy-Item README.md,LICENSE,NOTICE,CHANGELOG.md "dist/$asset/"
          Copy-Item -Recurse skills "dist/$asset/skills"
          Copy-Item "target/orqella-${{ matrix.platform }}.cdx.json" "dist/$asset/"
          Compress-Archive -Path "dist/$asset/*" -DestinationPath "dist/$asset.zip"
          Remove-Item -Recurse -Force "dist/$asset"
          (Get-FileHash "dist/$asset.zip" -Algorithm SHA256).Hash.ToLower() + "  $asset.zip" |
            Set-Content "dist/$asset.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orqella-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Add checksums and update manifest
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 > artifacts/SHA256SUMS.txt
          if [ -f ORQELLA_UPDATE.json ]; then
            cp ORQELLA_UPDATE.json artifacts/
            cp ORQELLA_UPDATE.json.minisig artifacts/
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=""
          case "${RELEASE_TAG}" in
            *-rc*|*-beta*|*-alpha*) prerelease="--prerelease" ;;
          esac
          body=$(cat <<'EOF'
          Prebuilt Orqella daemon and CLI binaries.

          Download the archive for your platform, verify it against
          `SHA256SUMS.txt`, and run `orqella serve`. The archive includes the
          README, license, changelog, and an SBOM.

          Installed daemons update from this release:

          ```bash
          orqella update check
          orqella update apply
          ```

          The updater selects the archive for the current platform, verifies
          its SHA-256 checksum, replaces the binary, and restarts the daemon.
          It does not require a git checkout or Rust.
          EOF
          )
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          else
            gh release create "${RELEASE_TAG}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Orqella ${RELEASE_TAG}" \
              --notes "${body}" \
              --generate-notes \
              --verify-tag \
              ${prerelease}
          fi
