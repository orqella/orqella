name: Release Orqella

# Public releases are cut from tags. A tag release builds the daemon/CLI for
# Linux, macOS (Intel and Apple Silicon), and Windows, publishes SHA-256
# checksums, and attaches the signed update manifest when one is present.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.5.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-orqella-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - id: version
        name: Read and validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "orqella") | .version')"
          expected="v${version}"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "tag ${RELEASE_TAG} does not match Cargo.toml ${expected}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify signed update manifest
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
          # release-verify.sh resolves the signed release commit with git
          # merge-base, so the job needs the tagged commit's history.
          fetch-depth: 0
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify manifest when present
        env:
          ORQELLA_UPDATE_PUBLIC_KEY: ${{ secrets.ORQELLA_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ORQELLA_UPDATE.json ]; then
            if [ -n "${ORQELLA_UPDATE_PUBLIC_KEY}" ]; then
              echo "ORQELLA_UPDATE_PUBLIC_KEY is configured, so this release must include a signed ORQELLA_UPDATE.json and .minisig." >&2
              echo "Run scripts/release-sign.sh with the offline key before tagging; see docs/RELEASE.md." >&2
              exit 1
            fi
            echo "No ORQELLA_UPDATE.json in this tag; publishing checksum-only assets."
            exit 0
          fi
          if [ -z "${ORQELLA_UPDATE_PUBLIC_KEY}" ]; then
            echo "ORQELLA_UPDATE_PUBLIC_KEY is required to publish a signed update manifest" >&2
            exit 1
          fi
          scripts/release-verify.sh

  build:
    name: Build ${{ matrix.platform }}
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            archive: tar.gz
          - os: macos-15
            target: x86_64-apple-darwin
            platform: macos-x86_64
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            archive: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Import the macOS signing certificate
        if: matrix.os == 'macos-15'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_KEY_P8 \
            APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::macOS daemon releases must be signed; missing secrets: ${missing[*]}"
            exit 1
          fi
          keychain="${RUNNER_TEMP}/orqella-signing-${RANDOM}.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="${RUNNER_TEMP}/developer-id.p12"
          printf '%s' "${APPLE_CERTIFICATE}" | openssl base64 -d -A > "${cert}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${cert}" -k "${keychain}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain}"
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security default-keychain -s "${keychain}"
          security find-identity -v -p codesigning "${keychain}"
          if ! security find-identity -v -p codesigning "${keychain}" \
            | grep -Fq "${APPLE_SIGNING_IDENTITY}"; then
            echo "::error::APPLE_SIGNING_IDENTITY is not present in the imported certificate"
            exit 1
          fi
          p8="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${p8}"
          chmod 600 "${p8}"
          {
            printf 'APPLE_KEYCHAIN=%s\n' "${keychain}"
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "${APPLE_SIGNING_IDENTITY}"
            printf 'APPLE_API_KEY=%s\n' "${APPLE_API_KEY}"
            printf 'APPLE_API_KEY_PATH=%s\n' "${p8}"
            printf 'APPLE_API_ISSUER=%s\n' "${APPLE_API_ISSUER}"
          } >> "${GITHUB_ENV}"
      - name: Sign the macOS daemon
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/orqella"
          test -x "${bin}" || { echo "::error::daemon binary not found"; exit 1; }
          codesign --force --options runtime --timestamp \
            --keychain "${APPLE_KEYCHAIN}" \
            --sign "${APPLE_SIGNING_IDENTITY}" "${bin}"
          codesign --verify --strict --verbose=2 "${bin}"
          codesign -dvvv "${bin}" 2>&1 | tee "${RUNNER_TEMP}/codesign.txt"
          grep -q '^Timestamp=' "${RUNNER_TEMP}/codesign.txt" || {
            echo "::error::the daemon signature has no secure timestamp"
            exit 1
          }
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: target/orqella-${{ matrix.platform }}.cdx.json
      - name: Package (Unix)
        if: matrix.os != 'windows-2022'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          asset="orqella-${VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/orqella" "dist/${asset}/"
          cp README.md LICENSE NOTICE CHANGELOG.md "dist/${asset}/"
          cp -R skills "dist/${asset}/"
          cp "target/orqella-${{ matrix.platform }}.cdx.json" "dist/${asset}/"
          # The binary must be the first archive entry. Updaters released
          # before 0.9.2 stop at the first entry named `orqella`, including
          # the `skills/orqella/` directory, and would install an empty file.
          tar -C "dist/${asset}" -czf "dist/${asset}.tar.gz" \
            ./orqella \
            ./README.md ./LICENSE ./NOTICE ./CHANGELOG.md \
            ./skills \
            "./orqella-${{ matrix.platform }}.cdx.json"
          first="$(tar -tzf "dist/${asset}.tar.gz" | head -n 1)"
          if [[ "${first}" != "./orqella" ]]; then
            echo "::error::the daemon binary is not the first archive entry (got ${first})"
            exit 1
          fi
          rm -rf "dist/${asset}"
          (cd dist && (sha256sum "${asset}.tar.gz" 2>/dev/null || shasum -a 256 "${asset}.tar.gz") > "${asset}.tar.gz.sha256")
      - name: Notarize the macOS daemon
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/orqella"
          archive="${RUNNER_TEMP}/orqella-${{ matrix.platform }}-notarize.zip"
          # notarytool accepts zip, dmg, and pkg. The ticket is registered
          # against the binary's code hash, so the copy inside the tarball is
          # covered even though a bare Mach-O cannot be stapled.
          ditto -c -k --keepParent "${bin}" "${archive}"
          xcrun notarytool submit "${archive}" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
      - name: Package (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $asset = "orqella-$env:VERSION-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "dist/$asset" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/orqella.exe" "dist/$asset/"
          Copy-Item README.md,LICENSE,NOTICE,CHANGELOG.md "dist/$asset/"
          Copy-Item -Recurse skills "dist/$asset/skills"
          Copy-Item "target/orqella-${{ matrix.platform }}.cdx.json" "dist/$asset/"
          # The binary must be the first archive entry. Updaters released
          # before 0.9.2 stop at the first entry named `orqella`, including
          # the `skills/orqella/` directory, and would install an empty file.
          Compress-Archive -Path "dist/$asset/orqella.exe" -DestinationPath "dist/$asset.zip"
          Compress-Archive -Path "dist/$asset/README.md","dist/$asset/LICENSE","dist/$asset/NOTICE","dist/$asset/CHANGELOG.md","dist/$asset/skills","dist/$asset/orqella-${{ matrix.platform }}.cdx.json" -DestinationPath "dist/$asset.zip" -Update
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/$asset.zip"))
          $first = $zip.Entries[0].FullName
          $zip.Dispose()
          if ($first -ne "orqella.exe") {
            throw "the daemon binary is not the first archive entry (got $first)"
          }
          Remove-Item -Recurse -Force "dist/$asset"
          (Get-FileHash "dist/$asset.zip" -Algorithm SHA256).Hash.ToLower() + "  $asset.zip" |
            Set-Content "dist/$asset.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orqella-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  windows-installer:
    name: Build Windows setup
    needs: [prepare, build]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orqella-windows-x86_64
          path: dist/windows
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.10 --yes --no-progress
      - name: Unpack the daemon
        id: daemon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Get-ChildItem dist/windows/*.zip | Select-Object -First 1
          if (-not $archive) { throw "no Windows daemon archive was found" }
          Expand-Archive -Path $archive.FullName -DestinationPath dist/windows/unpacked
          $exe = Get-ChildItem dist/windows/unpacked -Recurse -Filter orqella.exe | Select-Object -First 1
          if (-not $exe) { throw "orqella.exe was not found in the archive" }
          "daemon_exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
      - name: Fetch the latest desktop setup
        id: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $desktop = $releases |
            Where-Object {
              $_.tag_name -match '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' -and
              -not $_.draft -and -not $_.prerelease
            } |
            Sort-Object { [version]($_.tag_name -replace '^desktop-v','') } -Descending |
            Select-Object -First 1
          if (-not $desktop) {
            Write-Host "No published desktop release; building the daemon-only setup."
            exit 0
          }
          New-Item -ItemType Directory -Force dist/desktop | Out-Null
          gh release download $desktop.tag_name --pattern '*-setup.exe' --dir dist/desktop
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not download the desktop setup; skipping the combined installer."
            exit 0
          }
          gh release download $desktop.tag_name --pattern 'SHA256SUMS.txt' --dir dist/desktop
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not download the desktop checksums; skipping the combined installer."
            exit 0
          }
          $setup = Get-ChildItem dist/desktop/*setup.exe | Select-Object -First 1
          if (-not $setup) {
            Write-Warning "No desktop setup was found in $($desktop.tag_name); skipping the combined installer."
            exit 0
          }
          $line = Get-Content dist/desktop/SHA256SUMS.txt |
            Where-Object { $_ -match ([regex]::Escape($setup.Name) + '$') } |
            Select-Object -First 1
          if (-not $line) { throw "no checksum for $($setup.Name)" }
          $expected = ($line -split '\s+')[0].ToLower()
          $actual = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "checksum mismatch for $($setup.Name)" }
          "desktop_setup=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "desktop_tag=$($desktop.tag_name)" >> $env:GITHUB_OUTPUT
      - name: Compile the combined setup
        if: steps.desktop.outputs.desktop_setup != '' && hashFiles('installer/windows/orqella.nsi') != ''
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DAEMON_EXE: ${{ steps.daemon.outputs.daemon_exe }}
          DESKTOP_SETUP: ${{ steps.desktop.outputs.desktop_setup }}
        run: |
          $ErrorActionPreference = "Stop"
          $makensis = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis was not installed" }
          $viVersion = if ($env:VERSION -match '^[0-9]+\.[0-9]+\.[0-9]+$') {
            "$($env:VERSION).0"
          } else {
            "0.0.0.0"
          }
          $name = "Orqella-Setup-$env:VERSION-windows-x86_64.exe"
          $outfile = Join-Path (Get-Location) "dist\$name"
          $nsisArgs = @(
            "/V2",
            "/DVERSION=$env:VERSION",
            "/DVI_VERSION=$viVersion",
            "/DDAEMON_EXE=$env:DAEMON_EXE",
            "/DOUTFILE=$outfile",
            "/DICON=$((Resolve-Path 'client/desktop/src-tauri/icons/icon.ico').Path)"
          )
          if ($env:DESKTOP_SETUP) { $nsisArgs += "/DDESKTOP_SETUP=$env:DESKTOP_SETUP" }
          & $makensis @nsisArgs installer/windows/orqella.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          $hash = (Get-FileHash $outfile -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "dist\$name.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.desktop.outputs.desktop_setup != '' && hashFiles('installer/windows/orqella.nsi') != ''
        with:
          name: orqella-windows-setup
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build, windows-installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Add checksums and update manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ -f install.sh ]; then
            cp install.sh artifacts/install.sh
            (cd artifacts && sha256sum install.sh > install.sh.sha256)
          fi
          cat artifacts/*.sha256 > artifacts/SHA256SUMS.txt
          if [ -f ORQELLA_UPDATE.json ]; then
            cp ORQELLA_UPDATE.json artifacts/
            cp ORQELLA_UPDATE.json.minisig artifacts/
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=""
          case "${RELEASE_TAG}" in
            *-rc*|*-beta*|*-alpha*) prerelease="--prerelease" ;;
          esac
          body=$(cat <<'EOF'
          ## Install

          Linux and macOS, one command:

          ```bash
          curl -fsSL https://orqella.io/install.sh | sh
          ```

          The installer verifies the release checksums, installs the daemon,
          CLI, desktop app, and per-user service, and waits for the dashboard.
          It does not use sudo or require Rust.

          Windows: download `Orqella-Setup-<version>-windows-x86_64.exe` from
          this release when present. It installs the daemon, CLI, desktop app,
          and startup entry for the current user. If no setup is attached, use
          the Windows archive.

          Manual archives are also attached. Verify them against
          `SHA256SUMS.txt`. The archives include the README, license, changelog,
          and an SBOM.

          Installed daemons update from this release:

          ```bash
          orqella update check
          orqella update apply
          ```

          The updater selects the archive for the current platform, verifies
          its SHA-256 checksum, replaces the binary, and restarts the daemon.
          It does not require a git checkout or Rust.
          EOF
          )
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          else
            gh release create "${RELEASE_TAG}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Orqella ${RELEASE_TAG}" \
              --notes "${body}" \
              --generate-notes \
              --verify-tag \
              ${prerelease}
          fi
