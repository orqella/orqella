name: Bug report
description: Report a reproducible problem in Orqella
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please redact tokens, private keys, account identifiers, and personal data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start orqella serve
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orqella version or commit
      placeholder: v0.1.0 or commit hash
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or diagnostics
      description: Use orqella support for a redacted bundle if possible. Do not paste secrets.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed tokens, private keys, and personal data from this report.
          required: true
        - label: This is not a security vulnerability. I will report security issues through the private advisory flow.
          required: true
