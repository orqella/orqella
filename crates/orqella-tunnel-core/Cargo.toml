[package]
name = "orqella-tunnel-core"
version = "0.1.0"
edition = "2024"
description = "Portable foreground SSH tunnel core for Orqella clients"
license = "MIT"
publish = false

[features]
cli = ["uniffi/cli"]

[dependencies]
anyhow = "1"
orqella-link-core = { path = "../orqella-link-core" }
clap = { version = "4", features = ["derive"] }
rand = "0.10"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uniffi = "0.32"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "orqella-tunnel"
path = "src/bin/orqella-tunnel.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]
