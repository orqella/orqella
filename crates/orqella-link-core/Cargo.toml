[package]
name = "orqella-link-core"
version = "0.1.0"
edition = "2024"
description = "Account-assisted direct iroh SSH transport for Orqella"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
iroh = "1.4.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
